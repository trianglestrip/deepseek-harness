<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      background: #1b1b1f;
      color: #e8e8ea;
      margin: 0;
    }
    main { max-width: 640px; padding: 2rem; text-align: center; }
    h1 { font-size: 1.2rem; font-weight: 600; }
    p { color: #a8a8b0; white-space: pre-wrap; word-break: break-word; }
    .actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit;
      color: #e8e8ea;
      background: #2f2f36;
      border: 1px solid #4a4a54;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    button:hover { background: #3a3a43; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">DeepSeek Harness Desktop</h1>
    <p id="message"></p>
    <p id="advice"></p>
    <div class="actions">
      <button id="retry" hidden></button>
      <button id="disable" hidden></button>
      <button id="reset" hidden></button>
      <button id="restart" hidden></button>
    </div>
  </main>
  <script type="module" src="./startup.js"></script>
</body>
</html>
