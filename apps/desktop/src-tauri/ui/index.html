<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      background: #1b1b1f;
      color: #e8e8ea;
      margin: 0;
    }
    main { max-width: 640px; padding: 2rem; text-align: center; }
    h1 { font-size: 1.2rem; font-weight: 600; }
    p { color: #a8a8b0; white-space: pre-wrap; word-break: break-word; }
    .actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit;
      color: #e8e8ea;
      background: #2f2f36;
      border: 1px solid #4a4a54;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    button:hover { background: #3a3a43; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">DeepSeek Harness Desktop</h1>
    <p id="message"></p>
    <div class="actions">
      <button id="restart" hidden></button>
    </div>
  </main>
  <script type="module">
    // `window.dsh` is installed by the shell before this document runs.
    const { messages } = await window.dsh.locale()
    const title = document.getElementById('title')
    const message = document.getElementById('message')
    const restart = document.getElementById('restart')
    const started = Date.now()
    let failed = false
    let backend = { phase: 'starting' }

    restart.textContent = messages.restartApplication

    // The shell owns backend availability; the fragment carries the failure text
    // so it survives a reload before this command answers.
    const refreshStatus = async () => {
      try {
        backend = await window.dsh.backend.status()
      } catch {
        backend = { phase: 'starting' }
      }
      return backend
    }

    const renderProgress = () => {
      if (failed) return
      const seconds = Math.floor((Date.now() - started) / 1000)
      const elapsed = seconds === 0 ? '' : ' (' + String(seconds) + 's)'
      title.textContent = messages.startupLoading
      message.textContent = messages.startupLoadingDescription + elapsed
    }

    const renderFragment = async () => {
      const fragment = new URLSearchParams(location.hash.slice(1)).get('message')
      if (fragment === null) {
        failed = false
        restart.hidden = true
        renderProgress()
        return
      }
      failed = true
      const state = await refreshStatus()
      title.textContent = messages.startupFailed
      message.textContent = (state.message ?? fragment) + '\n\n' + messages.startupErrorDescription
      restart.hidden = false
    }

    restart.addEventListener('click', () => {
      restart.hidden = true
      failed = false
      renderProgress()
      window.dsh.backend.retry().catch((error) => {
        const detail = error === null || error === undefined ? messages.unknownError : String(error)
        title.textContent = messages.startupFailed
        message.textContent = detail
        restart.hidden = false
      })
    })

    window.addEventListener('hashchange', () => { void renderFragment() })
    void renderFragment()
    setInterval(renderProgress, 1000)
  </script>
</body>
</html>
